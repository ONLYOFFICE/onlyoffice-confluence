name: Artifact

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened]
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
      - '.check-licenses.yml'
  
jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get Info 
        run: |
          echo "version=$(awk '/<version>/,/<\/version>/' pom.xml | head -n 1 | sed 's/^[[:space:]]*//g' | sed -n 's:.*<version>\(.*\)</version>.*:\1:p')" >> $GITHUB_OUTPUT
          echo "artifact=$(awk '/<artifactId>/,/<\/artifactId>/' pom.xml | head -n 1 | sed 's/^[[:space:]]*//g' | sed -n 's:.*<artifactId>\(.*\)</artifactId>.*:\1:p')" >> $GITHUB_OUTPUT
        id: info
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Build Artifact
        run: |
          cd ${{ github.workspace }}
          cwd=$(pwd)
          curl -fsSL -o /tmp/atlassian-plugin-sdk.tar.gz https://marketplace.atlassian.com/download/plugins/atlassian-plugin-sdk-tgz
          mkdir -p "$HOME/atlassian-plugin-sdk"
          tar -xzf /tmp/atlassian-plugin-sdk.tar.gz -C "$HOME/atlassian-plugin-sdk" --strip-components=1
          export PATH="$HOME/atlassian-plugin-sdk/bin:$PATH"
          atlas-version
          atlas-package
          cd ./target
          mv ${{ steps.info.outputs.artifact }}-${{ steps.info.outputs.version }}.jar $cwd
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.info.outputs.artifact }}-${{ steps.info.outputs.version }}
          path: ${{ steps.info.outputs.artifact }}-${{ steps.info.outputs.version }}.jar